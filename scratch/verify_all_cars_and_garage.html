function waitUntil(fn, timeoutMs = 25000) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    const tick = () => {
      try {
        const res = fn();
        if (res) return resolve(res);
      } catch (e) {}
      if (Date.now() - start > timeoutMs) return reject(new Error('Timeout waiting for condition'));
      setTimeout(tick, 100);
    };
    tick();
  });
}

function measureFrontRearSilhouette(THREE, root) {
  root.updateMatrixWorld(true);
  const v = new THREE.Vector3();
  let minY = Infinity, maxY = -Infinity;
  let frontMaxY = -Infinity, rearMaxY = -Infinity;
  root.traverse(o => {
    if (!o.isMesh || o.visible === false || !o.geometry || !o.geometry.attributes || !o.geometry.attributes.position) return;
    const pos = o.geometry.attributes.position;
    const step = Math.max(1, Math.floor(pos.count / 500));
    for (let i = 0; i < pos.count; i += step) {
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      if (v.y < minY) minY = v.y;
      if (v.y > maxY) maxY = v.y;
      if (v.x > 1.25 && v.y > frontMaxY) frontMaxY = v.y;
      if (v.x < -1.25 && v.y > rearMaxY) rearMaxY = v.y;
    }
  });
  return {
    minY: Number(minY.toFixed(3)),
    maxY: Number(maxY.toFixed(3)),
    frontBinMaxY: Number(frontMaxY.toFixed(3)),
    rearBinMaxY: Number(rearMaxY.toFixed(3))
  };
}

    const win = await waitUntil(() => {
      const w = frame.contentWindow;
      return (
        w && w.THREE && w.CIRCUITS && w.CAR_MODEL_PRESETS && w.CAR_CATALOG &&
        w.carAssetState && w.loadVehicleFromURLs && w.openGarageScreen &&
        w.ApexRecords && w.estimateClassProLapTime && w.rebuildProBenchmarkForCurrentCar &&
        w.syncAIMultiCarModels && w.selectCircuit && w.getCarChassisTraits && w.getCarPerformanceProfile
      ) ? w : null;
    }, 30000);
    const doc = frame.contentDocument;

    const origErr = win.console.error.bind(win.console);
    win.console.error = (...args) => {
      report.errors.push('console.error: ' + args.map(String).join(' '));
      origErr(...args);
    };
    win.addEventListener('error', ev => report.errors.push('window.error: ' + (ev.message || ev.type)));
    win.addEventListener('unhandledrejection', ev => report.errors.push('unhandledrejection: ' + String(ev.reason)));

    win.carAssetState.loadSeq++;
    win.carAssetState.loading = false;

    // 1. Load & verify ALL 75 local car GLBs
    for (const spec of LOCAL_CARS) {
      const preset = win.CAR_MODEL_PRESETS.find(p => p.id === spec.id);
      if (!preset) {
        report.cars.push({ id: spec.id, ok: false, error: 'Preset missing' });
        continue;
      }
      const prevSeq = win.carAssetState.loadSeq;
      win.loadVehicleFromURLs(preset.urls, preset.label, preset.id);
      try {
        await waitUntil(() => !win.carAssetState.loading && win.carAssetState.loadedPresetId === spec.id && win.carAssetState.loadSeq > prevSeq, 45000);
        const st = win.carAssetState.stats;
        const rig = { FL: null, FR: null, RL: null, RR: null };
        win.carAssetState.template.traverse(o => {
          if (/^apex_steer_(FL|FR|RL|RR)$/.test(o.name)) {
            rig[o.name.slice(-2)] = Number(o.position.x.toFixed(3));
          }
        });
        const sil = measureFrontRearSilhouette(win.THREE, win.carAssetState.template);
        const dimsOk = st.dims.length >= 3.85 && st.dims.length <= 5.20 &&
                       st.dims.width >= 1.55 && st.dims.width <= 2.45 &&
                       st.dims.height >= 0.85 && st.dims.height <= spec.maxH;
        const groundOk = Math.abs(sil.minY) <= 0.05;
        const wheelsOk = spec.expectWheels === 0 ? true : (st.wheels === 4 && rig.FL > rig.RL && rig.FR > rig.RR);
        const orientOk = sil.frontBinMaxY <= sil.rearBinMaxY + 0.08;
        report.cars.push({
          id: spec.id,
          carClass: spec.carClass,
          ok: !!(st.hasBody && dimsOk && groundOk && wheelsOk && orientOk),
          wheels: st.wheels,
          tris: st.tris,
          hasBody: st.hasBody,
          dims: { l: Number(st.dims.length.toFixed(2)), w: Number(st.dims.width.toFixed(2)), h: Number(st.dims.height.toFixed(2)) },
          minY: sil.minY,
          frontMaxY: sil.frontBinMaxY,
          rearMaxY: sil.rearBinMaxY,
          rigX: rig,
          checks: { dimsOk, groundOk, wheelsOk, orientOk }
        });
      } catch (e) {
        report.cars.push({ id: spec.id, ok: false, error: String(e && e.message || e) });
      }
    }

    // 2. Refined 10-Class PI Garage UI & Strength Filters Verification (79 total)
    win.carAssetState.presetId = 'ferrari458';
    win.carAssetState.loadedPresetId = 'ferrari458';
    win.openGarageScreen('home');
    await new Promise(r => setTimeout(r, 80));

    const getVisibleIds = () => Array.from(doc.querySelectorAll('#gar-car-strip [data-car-id]')).map(el => el.getAttribute('data-car-id'));
    const initialTab = win.flowState.garageClassTab;
    const initialIds = getVisibleIds();

    const CLASSES_10 = ['D', 'C', 'B', 'GT3', 'A', 'S', 'R', 'LMH', 'X', 'F1'];

    for (const cls of CLASSES_10) {
      doc.querySelector(`[data-gar-class="${cls}"]`).click();
      byTab[cls] = getVisibleIds();

    const searchInp = doc.getElementById('input-gar-search');

    searchInp.dispatchEvent(new win.Event('input', { bubbles: true }));
    const searchF40 = getVisibleIds();

    const btnGrid = doc.getElementById('btn-gar-grid-toggle');
    btnGrid.click();

    report.garageUi = {

    const allProfs = win.CAR_CATALOG.map(c => win.getCarPerformanceProfile(c.id));

      const pis = allProfs.filter(p => p.carClass === cls).map(p => p.pi);
      spreads[cls] = Math.max(...pis) - Math.min(...pis);
    }
    report.piProfiles = {
      allValid: allProfs.every(p => p.pi >= 350 && p.pi <= 999 && Array.isArray(p.strengthTags) && p.strengthTags.length >= 1 && !!p.tradeoffTag && !!p.bestTrackType),

    win.selectCircuit(0); // Monza
    const estMonza = {};

    })();
    const aiF1 = (() => {
      win.syncAIMultiCarModels('f1_2026_sf26');
      return (win.aiCars || []).map(a => a.assignedPresetId);
    })();
    const civicTraits = win.getCarChassisTraits(win.CAR_HANDLING_PROFILES.honda_civic_type_r);
    report.classPhysics = { estMonza, aiS, aiF1, civicLayout: civicTraits.layout };

    await win.ApexRecords.ready();
    win.ApexRecords.clearAllForTesting();
    await win.ApexRecords.whenIdle();

    const lenM = win.getTotalTrackLength();
    win.ApexRecords.recordCompletedLap({
      circuitId: 'monza', circuitName: 'Monza', trackLengthM: lenM,
      edition: 'realistic', mode: 'time_attack',
      car: { presetId: 'nissan_xtrail', carName: 'NISSAN X-TRAIL', carClass: 'D' },
      setup: { tireCompound: 'medium', transmission: 'AT' },
      conditions: { weather: 'dry', surfaceState: 'fast' },
      timing: { lapTime: 132.450, isValidLap: true, topSpeedKmh: 205 }
    });
    win.ApexRecords.recordCompletedLap({
      circuitId: 'monza', circuitName: 'Monza', trackLengthM: lenM,
      edition: 'realistic', mode: 'time_attack',
      car: { presetId: 'f1_2026_sf26', carName: 'SF-26 F1', carClass: 'F1' },
      setup: { tireCompound: 'soft', transmission: 'AT' },
      conditions: { weather: 'dry', surfaceState: 'fast' },
      timing: { lapTime: 78.120, isValidLap: true, topSpeedKmh: 372 }
    });
    const spoofRes = win.ApexRecords.importRecordsJSON(JSON.stringify({
      schema: 'apex-pro-records-v1',
      records: [
        {
          id: 'spoof_f1_as_gt3', recordedAt: '2026-11-22T22:00:00Z', driverName: 'SPOOF_F1',
          circuitId: 'monza', edition: 'realistic',
          car: { presetId: 'f1_2026_sf26', carName: 'FAKE GT3 SF26', carClass: 'GT3' },
          conditions: { weather: 'dry' }, timing: { lapTime: 77.500, isValidLap: true }
        },
        {
          id: 'spoof_suv_as_lmh', recordedAt: '2026-11-22T22:01:00Z', driverName: 'SPOOF_SUV',
          circuitId: 'monza', edition: 'realistic',
          car: { presetId: 'nissan_xtrail', carName: 'FAKE LMH SUV', carClass: 'LMH' },
          conditions: { weather: 'dry' }, timing: { lapTime: 135.000, isValidLap: true }
        }
      ]
    }));
    const bD = win.ApexRecords.getClassLeaderboard({ circuitId: 'monza', carClass: 'D', edition: 'realistic', weather: 'dry', dedupeMode: 'all' });
    const bGt3 = win.ApexRecords.getClassLeaderboard({ circuitId: 'monza', carClass: 'GT3', edition: 'realistic', weather: 'dry', dedupeMode: 'all' });
    const bLmh = win.ApexRecords.getClassLeaderboard({ circuitId: 'monza', carClass: 'LMH', edition: 'realistic', weather: 'dry', dedupeMode: 'all' });
    const bF1 = win.ApexRecords.getClassLeaderboard({ circuitId: 'monza', carClass: 'F1', edition: 'realistic', weather: 'dry', dedupeMode: 'all' });

    report.recordsIsolation = {
      spoofSanitized: spoofRes.sanitizedClasses,
      dCount: bD.entries.length,
      gt3Count: bGt3.entries.length,
      lmhCount: bLmh.entries.length,
      f1Count: bF1.entries.length
    };

    win.ApexRecords.clearAllForTesting();
    await win.ApexRecords.whenIdle();

    if (win.__APEX_ERRORS && win.__APEX_ERRORS.length) {
      report.errors.push(...win.__APEX_ERRORS);
    }
  } catch (err) {
    report.errors.push(err && err.stack ? err.stack : String(err));
  }
  document.getElementById('status').textContent = JSON.stringify(report);
  try {
    await fetch('/__report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(report) });
  } catch (e) {}
})();
