<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Verify Real-World Vehicle Performance Across All 5 Classes</title></head>
<body>
<iframe id="app" src="/index.html" style="width:1280px;height:720px;"></iframe>
<pre id="status">BOOTING</pre>
<script>
const TEST_CARS = [
  'nissan_xtrail',
  'lamborghini_countach',
  'ferrari_f40_lbw',
  'lamborghini_aventador',
  'ferrari458',
  'ferrari_laferrari',
  'ferrari_sf90_xx',
  'mclaren_senna',
  'pagani_huayra_r',
  'amg_one',
  'porsche_919_evo',
  'f1_2026_sf26'
];

function waitUntil(fn, timeoutMs = 30000) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    const tick = () => {
      try {
        const res = fn();
        if (res) return resolve(res);
      } catch (e) {}
      if (Date.now() - start > timeoutMs) return reject(new Error('Timeout waiting for condition'));
      setTimeout(tick, 100);
    };
    tick();
  });
}

(async () => {
  const report = { errors: [], benchmarks: [], drivetrainChecks: {} };
  try {
    const frame = document.getElementById('app');
    const win = await waitUntil(() => {
      const w = frame.contentWindow;
      return (
        w && w.CIRCUITS && w.CAR_HANDLING_PROFILES && w.carAssetState &&
        w.simState && w.stepPhysics && w.selectCircuit && w.resetSession &&
        w.rebuildProBenchmarkForCurrentCar && w.getCarDrivetrainSpec
      ) ? w : null;
    }, 30000);

    // Prevent audio init or 3D GLB downloads from interfering: mutate presetId + rebuildProBenchmark directly
    win.applyCarSetupPreset('balanced');
    win.setTrackSurfaceState('fast');
    win.setWeatherMode('dry');
    win.setTireCompound('medium');
    win.simState.edition = 'realistic';
    win.simState.mode = 'time_attack';

    for (const id of TEST_CARS) {
      win.carAssetState.presetId = id;
      const cp = win.getCurrentCarHandling();
      const dtSpec = win.getCarDrivetrainSpec(cp);

      // 1. Monza & Spa PRO benchmark lap times
      win.selectCircuit(0); // Monza
      win.rebuildProBenchmarkForCurrentCar();
      const proMonza = win.PRO_LAP_TIME;

      win.selectCircuit(3); // Spa
      win.rebuildProBenchmarkForCurrentCar();
      const proSpa = win.PRO_LAP_TIME;

      // 2. 35s Full-Throttle Acceleration Run (0-100, 0-200, 0-300, terminal Vmax, max gear/RPM)
      win.selectCircuit(0);
      win.resetSession(false);
      win.simState.edition = 'realistic';
      win.simState.inShowcaseMode = false;
      win.simState.paused = false;
      win.simState.countdownActive = false;
      win.simState.autoTransmission = true;
      win.inputs.throttle = true;
      win.inputs.brake = false;
      win.inputs.trailBrake = false;
      win.inputs.steerLeft = false;
      win.inputs.steerRight = false;

      let maxGearSeen = 1;
      let maxRpmSeen = 0;
      const straightHeading = win.sampleTrackAtS(20).heading;
      for (let i = 0; i < 1750; i++) { // 35.0 seconds @ 0.02s
        win.simState.s = 20;
        win.simState.d = 0;
        win.simState.heading = straightHeading;
        win.simState.yawRate = 0;
        win.stepPhysics(0.02);
        if (win.simState.gear > maxGearSeen) maxGearSeen = win.simState.gear;
        if (win.simState.rpm > maxRpmSeen) maxRpmSeen = win.simState.rpm;
      }
      win.inputs.throttle = false;
      const t0100 = win.simState.bench0to100 ? Number(win.simState.bench0to100.toFixed(2)) : null;
      const t0200 = win.simState.bench0to200 ? Number(win.simState.bench0to200.toFixed(2)) : null;
      const t0300 = win.simState.bench0to300 ? Number(win.simState.bench0to300.toFixed(2)) : null;
      const topSpeed35s = Number(win.simState.speedKmh.toFixed(1));

      // 3. Cornering G & Aero Downforce Test at 180 km/h and 250 km/h
      function measureCornerAt(spdKmh) {
        win.resetSession(false);
        win.simState.edition = 'realistic';
        win.simState.inShowcaseMode = false;
        win.simState.paused = false;
        win.simState.countdownActive = false;
        win.simState.speedMs = spdKmh / 3.6;
        win.simState.speedKmh = spdKmh;
        win.simState.throttleInput = 20;
        win.simState.brakeInput = 0;
        win.simState.steerInput = 1.0;
        win.eval('manualSteerDrag = true; manualThrottleDrag = true; manualBrakeDrag = true;');
        let peakLatG = 0;
        let dfAtSpeed = 0;
        for (let i = 0; i < 18; i++) {
          win.simState.s = 50;
          win.simState.speedMs = spdKmh / 3.6;
          win.simState.speedKmh = spdKmh;
          win.stepPhysics(0.016);
          if (Math.abs(win.simState.latG) > peakLatG) peakLatG = Math.abs(win.simState.latG);
          if (i === 0) dfAtSpeed = win.simState.downforceKgf;
        }
        win.eval('manualSteerDrag = false; manualThrottleDrag = false; manualBrakeDrag = false;');
        return { latG: Number(peakLatG.toFixed(2)), dfKgf: dfAtSpeed };
      }

      const corner180 = measureCornerAt(180);
      const corner250 = measureCornerAt(id === 'nissan_xtrail' ? 180 : 250);

      // 4. Peak Threshold Braking Deceleration G at high speed (280 km/h, or 170 km/h for X-Trail)
      win.resetSession(false);
      win.simState.edition = 'realistic';
      win.simState.inShowcaseMode = false;
      win.simState.paused = false;
      win.simState.countdownActive = false;
      const brkTestKmh = id === 'nissan_xtrail' ? 170 : 280;
      win.simState.speedMs = brkTestKmh / 3.6;
      win.simState.speedKmh = brkTestKmh;
      win.simState.throttleInput = 0;
      win.simState.brakeInput = 86;
      win.simState.steerInput = 0;
      win.eval('manualSteerDrag = true; manualThrottleDrag = true; manualBrakeDrag = true;');
      let peakBrakeG = 0;
      for (let i = 0; i < 4; i++) {
        win.simState.s = 50;
        win.simState.heading = straightHeading;
        win.simState.yawRate = 0;
        win.stepPhysics(0.01);
        const decG = -win.simState.longG;
        if (decG > peakBrakeG) peakBrakeG = decG;
      }
      win.eval('manualSteerDrag = false; manualThrottleDrag = false; manualBrakeDrag = false;');

      report.benchmarks.push({
        id,
        carClass: cp.carClass,
        weightKg: cp.weightKg,
        maxGears: dtSpec.maxGears,
        redlineRpm: dtSpec.redlineRpm,
        maxGearSeen,
        maxRpmSeen,
        t0100,
        t0200,
        t0300,
        topSpeed35s,
        df250Kgf: corner250.dfKgf,
        latG180: corner180.latG,
        latG250: corner250.latG,
        brakeG: Number(peakBrakeG.toFixed(2)),
        proMonza,
        proSpa
      });
    }

    report.drivetrainChecks = {
      f1MaxGears: win.getCarMaxGears(win.CAR_HANDLING_PROFILES.f1_2026_sf26),
      gt3MaxGears: win.getCarMaxGears(win.CAR_HANDLING_PROFILES.ferrari458),
      countachMaxGears: win.getCarMaxGears(win.CAR_HANDLING_PROFILES.lamborghini_countach)
    };

    if (win.__APEX_ERRORS && win.__APEX_ERRORS.length) {
      report.errors = win.__APEX_ERRORS;
    }
  } catch (err) {
    report.errors.push(err && err.stack ? err.stack : String(err));
  }
  document.getElementById('status').textContent = JSON.stringify(report, null, 2);
  try {
    await fetch('/__report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(report)
    });
  } catch (e) {}
})();
</script>
</body>
</html>
