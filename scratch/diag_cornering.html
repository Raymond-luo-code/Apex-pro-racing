<script>
window.onerror = function(m,u,l){ document.getElementById('errs').textContent += m + '@' + l + '\n'; };
window.THREE = { Color: function(){}, Vector3: function(){} };
window.scene = { add: function(){} };
window.createGT3CarMesh = function() { return { visible: false, position: { set: function(){} }, rotation: { y: 0 }, userData: {} }; };
window.spawnSkidMark = function(){}; window.spawnTireSmoke = function(){}; window.updateSmokeParticles = function(){};
window.setSlotBrakeLight = function(m, on) { m.userData._lastBrakeOn = on; };
window.rebuild3DCircuitScene = function(){}; window.applyEngineCarGeometry = function(){};
window.headlightGroup = { visible: false }; window.formatLapTime = function(t){ return String(t); };
</script>
<script src="../js/audio.js"></script>
<script src="../js/circuits.js"></script>
<script src="../js/physics.js"></script>
<script src="../js/input.js"></script>
<script>
const report = {};
const car = CAR_HANDLING_PROFILES.ferrari458;

CIRCUITS.forEach((c, idx) => {
  selectCircuit(idx);
  const corners = [];
  let inCorner = false, peakK = 0, peakNode = null;
  for (let i = 0; i < trackNodes.length; i++) {
    const n = trackNodes[i];
    const absK = Math.abs(n.curvature);
    if (absK > 0.0025) {
      inCorner = true;
      if (absK > peakK) { peakK = absK; peakNode = n; }
    } else if (inCorner) {
      const R = 1 / peakK;
      const vProSample = getProProfileAtDistance(peakNode.s).speedKmh;
      const vMs = vProSample / 3.6;
      const latGNeededOnCenterline = (vMs * vMs * peakK) / 9.81;
      const maxDegAtPro = getDynamicMaxSteerDeg(vProSample, car, true);
      const understeerDamp = 1 + car.understeerCoeff * vMs * vMs;
      const maxLinearK = (Math.tan(maxDegAtPro * Math.PI / 180) / car.wheelbase) / understeerDamp;
      corners.push({
        s: Math.round(peakNode.s),
        name: peakNode.name.split(' ')[0],
        radiusM: Math.round(R),
        trackCurv: +peakK.toFixed(5),
        vTarget: Math.round(peakNode.vTarget),
        vProKmh: Math.round(vProSample),
        latGOnCenterlineAtProSpeed: +latGNeededOnCenterline.toFixed(2),
        understeerDamp: +understeerDamp.toFixed(2),
        maxSteerDegAtVPro: +maxDegAtPro.toFixed(2),
        maxLinearCurv: +maxLinearK.toFixed(5),
        canTurnTrackCenterline: maxLinearK >= peakK
      });
      inCorner = false; peakK = 0; peakNode = null;
    }
  }
  report[c.id] = { totalLenM: Math.round(totalTrackLength), widthM: c.width, corners };
});

// Check speed sweep AND realistic driving corner tests on Fuji T2 (hairpin) and Monza T2 (Curva Grande)
const spdSweep = [];
for (const spdKmh of [50, 80, 110, 140, 180, 220, 260]) {
  const vMs = spdKmh / 3.6;
  const maxDeg = getDynamicMaxSteerDeg(spdKmh, car, true);
  const understeerDamp = 1 + car.understeerCoeff * vMs * vMs;
  const maxK = (Math.tan(maxDeg * Math.PI / 180) / car.wheelbase) / understeerDamp;
  const minR = 1 / maxK;
  const latGAtFullLock = (vMs * vMs * maxK) / 9.81;
  const highSpeedBlend = Math.min(1.0, Math.max(0.0, (spdKmh - 140) / 80));
  const steer25 = 0.25 * (1 - highSpeedBlend) + (0.25*0.25*(3-0.5)) * highSpeedBlend;
  const k25 = (Math.tan((steer25 * maxDeg) * Math.PI / 180) / car.wheelbase) / understeerDamp;
  const minTimeToFullLock = 1.0 / (car.steerRampRate * (1 - Math.min(1, Math.max(0, (spdKmh-30)/210)) * 0.28));
  const casterHalfLife = Math.LN2 / (1.6 + (spdKmh / 24.0) * 1.15);
  spdSweep.push({
    spdKmh,
    maxDeg: +maxDeg.toFixed(2),
    understeerDamp: +understeerDamp.toFixed(2),
    minRadiusM: Math.round(minR),
    desiredLatG_fullLock: +latGAtFullLock.toFixed(2),
    desiredLatG_25pctSteer: +((vMs*vMs*k25)/9.81).toFixed(2),
    timeToFullLockSec: +minTimeToFullLock.toFixed(2),
    casterHalfLifeMs: Math.round(casterHalfLife * 1000)
  });
}

// Simulate AI/player-like tap-hold steering through Monza T2 at 195 km/h & Fuji T2 at 76 km/h
function simSteadyCircleTest(spdKmh, thrNorm) {
  selectCircuit(0); resetSession(false);
  simState.countdownActive = false; simState.paused = false; simState.inShowcaseMode = false; simState.edition = 'realistic';
  simState.speedMs = spdKmh / 3.6; simState.speedKmh = spdKmh;
  simState.throttleInput = thrNorm; simState.steerInput = 1.0;
  // check 1 frame yawRate & curvature
  inputs.throttle = thrNorm > 50; inputs.steerRight = true;
  manualSteerDrag = true; manualThrottleDrag = true; manualBrakeDrag = true;
  for(let i=0;i<15;i++) stepPhysics(0.016);
  const res = {
    spdKmh, thrNorm,
    actualLatG: +simState.latG.toFixed(2),
    actualYawRateDegS: +(simState.yawRate * 180 / Math.PI).toFixed(1),
    effectiveRadiusM: +(simState.speedMs / Math.max(0.001, Math.abs(simState.yawRate))).toFixed(1),
    isUndersteer: simState.isUndersteer,
    downforceKgf: simState.downforceKgf
  };
  manualSteerDrag = false; manualThrottleDrag = false; manualBrakeDrag = false;
  return res;
}

const circleTests = [
  simSteadyCircleTest(80, 0),
  simSteadyCircleTest(80, 100),
  simSteadyCircleTest(140, 0),
  simSteadyCircleTest(140, 100),
  simSteadyCircleTest(200, 0),
  simSteadyCircleTest(200, 100),
];

document.getElementById('out').textContent = JSON.stringify({ report, spdSweep, circleTests }, null, 2);
</script>
</body>
</html>
